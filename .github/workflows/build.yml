name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Jar'ı yükle
        uses: actions/upload-artifact@v4
        with:
          name: voiddunyasi-jar
          path: build/libs/*.jar
          if-no-files-found: error
